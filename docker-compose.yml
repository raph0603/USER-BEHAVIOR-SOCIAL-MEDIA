name: user-behavior-social-media

x-airflow-common: &airflow-common
  build:
    context: ./orchestrator/airflow

  environment: &airflow-common-env
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-secret
    AIRFLOW_UID: "0"
    DOCKER_HOST_PROJECT_DIR: ${DOCKER_HOST_PROJECT_DIR:-.}
    LAKEHOUSE_SCHEDULE_MINUTES: ${LAKEHOUSE_SCHEDULE_MINUTES:-60}
    YOUTUBE_KAFKA_TOPIC: ${YOUTUBE_KAFKA_TOPIC:-youtube.raw.events}
    X_COLLECTION_ENABLED: ${X_COLLECTION_ENABLED:-false}
    X_KAFKA_TOPIC: ${X_KAFKA_TOPIC:-x.raw.events}
    REDDIT_COLLECTION_ENABLED: ${REDDIT_COLLECTION_ENABLED:-false}
    REDDIT_KAFKA_TOPIC: ${REDDIT_KAFKA_TOPIC:-reddit.raw.events}
    YOUTUBE_CLEAN_KAFKA_TOPIC: ${YOUTUBE_CLEAN_KAFKA_TOPIC:-youtube.clean.events}
    X_CLEAN_KAFKA_TOPIC: ${X_CLEAN_KAFKA_TOPIC:-x.clean.events}
    REDDIT_CLEAN_KAFKA_TOPIC: ${REDDIT_CLEAN_KAFKA_TOPIC:-reddit.clean.events}
    YOUTUBE_DLQ_KAFKA_TOPIC: ${YOUTUBE_DLQ_KAFKA_TOPIC:-youtube.dlq.events}
    X_DLQ_KAFKA_TOPIC: ${X_DLQ_KAFKA_TOPIC:-x.dlq.events}
    REDDIT_DLQ_KAFKA_TOPIC: ${REDDIT_DLQ_KAFKA_TOPIC:-reddit.dlq.events}
    BRONZE_KAFKA_OUT_TOPIC: ${BRONZE_KAFKA_OUT_TOPIC:-lakehouse.bronze.for_silver}

  user: "0:0"

  volumes:
    - ${HOST_PROJECT_DIR:-.}/orchestrator/dags:/opt/airflow/dags:ro
    - ${HOST_PROJECT_DIR:-.}/orchestrator/logs:/opt/airflow/logs
    - ${HOST_PROJECT_DIR:-.}:/workspace
    - /var/run/docker.sock:/var/run/docker.sock

services:

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z

    container_name: minio

    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set lakehouse http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb -p lakehouse/lakehouse || true
      "


  kafka:
    image: apache/kafka:3.7.0

    container_name: kafka

    environment:
      - CLUSTER_ID=Y2FmZGRyb3Bfa3JhZnRfY2x1c3Rlcg==
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS=1
      - KAFKA_OFFSETS_TOPIC_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0

    ports:
      - "9092:9092"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1

    container_name: schema-registry

    depends_on:
      - kafka

    restart: unless-stopped

    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka:9092
      - SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR=1
      - SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS=10000

    ports:
      - "8081:8081"

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1

    container_name: kafdrop

    depends_on:
      - kafka

    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - JVM_OPTS=-Xms128M -Xmx256M

    ports:
      - "9002:9000"

  youtube-collector:
    build:
      context: ./playwright

    depends_on:
      - kafka
      - schema-registry

    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=${YOUTUBE_KAFKA_TOPIC:-youtube.raw.events}
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - SCHEMA_PATH=/app/schemas/playwright_event.avsc
      - SCHEMA_REGISTRY_WAIT_SEC=180
      - PRODUCER_MODE=youtube
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - YOUTUBE_OUTPUT_DIR=/app/api/yt_raw_json
      - YOUTUBE_SLEEP_SECONDS=0.5
      - YOUTUBE_SEARCH_QUERY=electric vehicle review
      - YOUTUBE_SEARCH_MAX_RESULTS=${YOUTUBE_SEARCH_MAX_RESULTS:-10}
      - PRODUCER_MAX_EVENTS=${YOUTUBE_MAX_EVENTS:-5}
      - COLLECTOR_STATE_DB=/app/state/youtube.sqlite
      - BOOTSTRAP_STATE_FROM_KAFKA=true

    volumes:
      - ${HOST_PROJECT_DIR:-.}/schemas:/app/schemas:ro
      - ${HOST_PROJECT_DIR:-.}/API:/app/api
      - ${HOST_PROJECT_DIR:-.}/data/collector-state:/app/state

  x-collector:
    build:
      context: ./playwright

    depends_on:
      - kafka
      - schema-registry

    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=${X_KAFKA_TOPIC:-x.raw.events}
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - SCHEMA_PATH=/app/schemas/playwright_event.avsc
      - SCHEMA_REGISTRY_WAIT_SEC=180
      - PRODUCER_MODE=x
      - X_CDP_URL=${X_CDP_URL:-http://host.docker.internal:9223}
      - X_CDP_WAIT_SECONDS=${X_CDP_WAIT_SECONDS:-90}
      - X_HEADLESS=${X_HEADLESS:-false}
      - X_GOOGLE_EMAIL=${X_GOOGLE_EMAIL:-}
      - X_GOOGLE_LOGIN_WAIT_SECONDS=${X_GOOGLE_LOGIN_WAIT_SECONDS:-90}
      - X_SEARCH_QUERIES=${X_SEARCH_QUERIES:-(electric vehicle OR EV OR "electric car") lang:en -filter:replies||(Tesla OR "EV charging" OR "battery range") lang:en -filter:replies}
      - X_SEARCH_WAIT_MS=${X_SEARCH_WAIT_MS:-20000}
      - X_SEARCH_RETRIES=${X_SEARCH_RETRIES:-3}
      - X_SEARCH_RETRY_SECONDS=${X_SEARCH_RETRY_SECONDS:-10}
      - X_SCROLL_ROUNDS=${X_SCROLL_ROUNDS:-5}
      - X_SCROLL_WAIT_MS=${X_SCROLL_WAIT_MS:-1500}
      - PRODUCER_MAX_EVENTS=${X_MAX_EVENTS:-5}
      - COLLECTOR_STATE_DB=/app/state/x.sqlite
      - BOOTSTRAP_STATE_FROM_KAFKA=true

    volumes:
      - ${HOST_PROJECT_DIR:-.}/schemas:/app/schemas:ro
      - ${HOST_PROJECT_DIR:-.}/data/collector-state:/app/state

  reddit-collector:
    build:
      context: ./playwright

    depends_on:
      - kafka
      - schema-registry

    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=${REDDIT_KAFKA_TOPIC:-reddit.raw.events}
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - SCHEMA_PATH=/app/schemas/playwright_event.avsc
      - SCHEMA_REGISTRY_WAIT_SEC=180
      - PRODUCER_MODE=reddit
      - REDDIT_SUBREDDITS=${REDDIT_SUBREDDITS:-electricvehicles,teslamotors}
      - REDDIT_POST_LIMIT=${REDDIT_POST_LIMIT:-8}
      - REDDIT_WAIT_MS=${REDDIT_WAIT_MS:-750}
      - PRODUCER_MAX_EVENTS=${REDDIT_MAX_EVENTS:-5}
      - COLLECTOR_STATE_DB=/app/state/reddit.sqlite
      - BOOTSTRAP_STATE_FROM_KAFKA=true

    volumes:
      - ${HOST_PROJECT_DIR:-.}/schemas:/app/schemas:ro
      - ${HOST_PROJECT_DIR:-.}/data/collector-state:/app/state

  spark-master:
    build:
      context: ./spark
      dockerfile: master/Dockerfile

    container_name: spark-master

    hostname: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "8080:8080"
      - "7077:7077"

    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_BUCKET=lakehouse
      - PRIVACY_HASH_SALT=dev-privacy-salt
      - KAFKA_TOPIC=${YOUTUBE_KAFKA_TOPIC:-youtube.raw.events},${X_KAFKA_TOPIC:-x.raw.events},${REDDIT_KAFKA_TOPIC:-reddit.raw.events}
      - BRONZE_KAFKA_OUT_TOPIC=${BRONZE_KAFKA_OUT_TOPIC:-lakehouse.bronze.for_silver}
      # Tuning knobs consumed by Spark jobs
      - SPARK_WORKER_COUNT=4
      - SPARK_WORKER_CORES=1
      # Optional override for shuffle partitions (if set, overrides auto calculation)
      - SPARK_SHUFFLE_PARTITIONS=

    volumes:
      - ${HOST_PROJECT_DIR:-.}/spark/jobs:/opt/spark/jobs
      - ${HOST_PROJECT_DIR:-.}/schemas:/opt/spark/schemas:ro
      - ${HOST_PROJECT_DIR:-.}/tests/spark:/opt/spark/tests

  spark-worker:
    build:
      context: ./spark
      dockerfile: worker/Dockerfile

    # Do not set container_name to allow scaling (multiple containers)
    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_BUCKET=lakehouse
      - PRIVACY_HASH_SALT=dev-privacy-salt
      # Tunables for scaling
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G

    volumes:
      - ${HOST_PROJECT_DIR:-.}/spark/jobs:/opt/spark/jobs
      - ${HOST_PROJECT_DIR:-.}/schemas:/opt/spark/schemas:ro
      - ${HOST_PROJECT_DIR:-.}/tests/spark:/opt/spark/tests

  airflow-postgres:
    image: postgres:15-alpine
    stop_grace_period: 60s

    environment:
      - POSTGRES_DB=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_USER=airflow

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    volumes:
      - ${HOST_PROJECT_DIR:-.}/data/airflow-postgres:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common

    depends_on:
      airflow-postgres:
        condition: service_healthy

    entrypoint: /bin/bash

    command: >
      -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Local
      --lastname Admin
      --role Admin
      --email admin@example.com || true
      "

  airflow-webserver:
    <<: *airflow-common

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: webserver

    ports:
      - "8088:8080"

  airflow-scheduler:
    <<: *airflow-common

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: scheduler

volumes:
  minio-data:
