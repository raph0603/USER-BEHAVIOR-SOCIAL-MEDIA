    YOUTUBE_TRANSCRIPT_BLOCK_COOLDOWN_SECONDS: ${YOUTUBE_TRANSCRIPT_BLOCK_COOLDOWN_SECONDS:-21600}
    YOUTUBE_TRANSCRIPT_MAX_ATTEMPTS: ${YOUTUBE_TRANSCRIPT_MAX_ATTEMPTS:-5}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_TRANSCRIPT_FALLBACK_ENABLED: ${GEMINI_TRANSCRIPT_FALLBACK_ENABLED:-false}
    GEMINI_TRANSCRIPT_MODEL: ${GEMINI_TRANSCRIPT_MODEL:-gemini-3.5-flash}
    GEMINI_TRANSCRIPT_MAX_ATTEMPTS: ${GEMINI_TRANSCRIPT_MAX_ATTEMPTS:-2}
    GEMINI_TRANSCRIPT_TIMEOUT_SECONDS: ${GEMINI_TRANSCRIPT_TIMEOUT_SECONDS:-120}
    GEMINI_TRANSCRIPT_MAX_DURATION_MINUTES: ${GEMINI_TRANSCRIPT_MAX_DURATION_MINUTES:-60}
    GEMINI_TRANSCRIPT_DAILY_VIDEO_MINUTES_BUDGET: ${GEMINI_TRANSCRIPT_DAILY_VIDEO_MINUTES_BUDGET:-120}
    GEMINI_TRANSCRIPT_COOLDOWN_SECONDS: ${GEMINI_TRANSCRIPT_COOLDOWN_SECONDS:-3600}
    YOUTUBE_COMMENT_BATCH_SIZE: ${YOUTUBE_COMMENT_BATCH_SIZE:-10}
    YOUTUBE_COMMENT_DAILY_REQUEST_BUDGET: ${YOUTUBE_COMMENT_DAILY_REQUEST_BUDGET:-100}
    YOUTUBE_CHANNEL_BATCH_SIZE: ${YOUTUBE_CHANNEL_BATCH_SIZE:-50}
    YOUTUBE_CHANNEL_RUN_LIMIT: ${YOUTUBE_CHANNEL_RUN_LIMIT:-200}
    YOUTUBE_CHANNEL_DAILY_REQUEST_BUDGET: ${YOUTUBE_CHANNEL_DAILY_REQUEST_BUDGET:-100}
    YOUTUBE_CHANNEL_ACTIVE_DAYS: ${YOUTUBE_CHANNEL_ACTIVE_DAYS:-30}
    YOUTUBE_CHANNEL_ACTIVE_REFRESH_HOURS: ${YOUTUBE_CHANNEL_ACTIVE_REFRESH_HOURS:-24}
    YOUTUBE_CHANNEL_INACTIVE_REFRESH_HOURS: ${YOUTUBE_CHANNEL_INACTIVE_REFRESH_HOURS:-168}
    YOUTUBE_CHANNEL_MAX_ATTEMPTS: ${YOUTUBE_CHANNEL_MAX_ATTEMPTS:-3}
    YOUTUBE_HIGH_GROWTH_VIEWS_PER_HOUR: ${YOUTUBE_HIGH_GROWTH_VIEWS_PER_HOUR:-1000}
    YOUTUBE_HIGH_GROWTH_INTERVAL_MULTIPLIER: ${YOUTUBE_HIGH_GROWTH_INTERVAL_MULTIPLIER:-0.5}
    YOUTUBE_METRICS_MAX_AGE_DAYS: ${YOUTUBE_METRICS_MAX_AGE_DAYS:-3650}
    YOUTUBE_VIRALITY_THRESHOLD: ${YOUTUBE_VIRALITY_THRESHOLD:-8.0}
    YOUTUBE_TRANSCRIPT_BACKFILL_LIMIT: ${YOUTUBE_TRANSCRIPT_BACKFILL_LIMIT:-500}
    YOUTUBE_TRANSCRIPT_BACKFILL_SLEEP_SECONDS: ${YOUTUBE_TRANSCRIPT_BACKFILL_SLEEP_SECONDS:-0.25}
    YOUTUBE_TRANSCRIPT_BACKFILL_MAX_ATTEMPTS: ${YOUTUBE_TRANSCRIPT_BACKFILL_MAX_ATTEMPTS:-5}
    YOUTUBE_TRANSCRIPT_BACKFILL_RETRY_COOLDOWN_SECONDS: ${YOUTUBE_TRANSCRIPT_BACKFILL_RETRY_COOLDOWN_SECONDS:-3600}
    YOUTUBE_TRANSCRIPT_BACKFILL_STOP_ON_RATE_LIMIT: ${YOUTUBE_TRANSCRIPT_BACKFILL_STOP_ON_RATE_LIMIT:-true}
    YOUTUBE_TRANSCRIPT_BACKFILL_FAIL_ON_RETRYABLE: ${YOUTUBE_TRANSCRIPT_BACKFILL_FAIL_ON_RETRYABLE:-false}
    YOUTUBE_SEARCH_MAX_RESULTS: ${YOUTUBE_SEARCH_MAX_RESULTS:-50}
    YOUTUBE_SEARCH_LANGUAGE: ${YOUTUBE_SEARCH_LANGUAGE:-en}
    YOUTUBE_SEARCH_ORDER: ${YOUTUBE_SEARCH_ORDER:-date}
    YOUTUBE_WATCH_PAGE_TIMEOUT_SECONDS: ${YOUTUBE_WATCH_PAGE_TIMEOUT_SECONDS:-20}
    YOUTUBE_AUTHOR_FETCH_WORKERS: ${YOUTUBE_AUTHOR_FETCH_WORKERS:-8}
    YOUTUBE_COMMENT_MAX_PAGES: ${YOUTUBE_COMMENT_MAX_PAGES:-3}
    YOUTUBE_TRANSCRIPT_MAX_FAILURES: ${YOUTUBE_TRANSCRIPT_MAX_FAILURES:-5}
    YOUTUBE_COLLECTION_TIMEOUT_SECONDS: ${YOUTUBE_COLLECTION_TIMEOUT_SECONDS:-900}
    YOUTUBE_MAX_EVENTS: ${YOUTUBE_MAX_EVENTS:-50}
    X_CDP_URL: ${X_CDP_URL:-}
    X_CDP_HOST: ${X_CDP_HOST:-host.docker.internal}
    X_CDP_TOKEN: ${X_CDP_TOKEN:-}
    X_CDP_WAIT_SECONDS: ${X_CDP_WAIT_SECONDS:-90}
    X_HEADLESS: ${X_HEADLESS:-true}
    X_USER_DATA_DIR: ${X_USER_DATA_DIR:-/workspace/data/collector-state/x-browser-profile}
    X_AUTH_TOKEN: ${X_AUTH_TOKEN:-}
    X_CT0: ${X_CT0:-}
    X_LOGIN_IDENTIFIER: ${X_LOGIN_IDENTIFIER:-}
    X_PASSWORD: ${X_PASSWORD:-}
    X_LOGIN_WAIT_SECONDS: ${X_LOGIN_WAIT_SECONDS:-90}
    X_LOGIN_STEP_WAIT_SECONDS: ${X_LOGIN_STEP_WAIT_SECONDS:-20}
    X_GOOGLE_EMAIL: ${X_GOOGLE_EMAIL:-}
    X_GOOGLE_LOGIN_WAIT_SECONDS: ${X_GOOGLE_LOGIN_WAIT_SECONDS:-90}
    X_LOGIN_DEBUG_DIR: ${X_LOGIN_DEBUG_DIR:-/workspace/data/collector-state/x-login-debug}
    X_SEARCH_QUERIES: ${X_SEARCH_QUERIES:-(electric vehicle OR EV OR "electric car") lang:en -filter:replies||(Tesla OR "EV charging" OR "battery range") lang:en -filter:replies||("xe điện" OR "ô tô điện" OR "pin xe điện") lang:vi -filter:replies||(Tesla OR VinFast OR "trạm sạc") lang:vi -filter:replies}
    X_SEARCH_NAVIGATION_TIMEOUT_MS: ${X_SEARCH_NAVIGATION_TIMEOUT_MS:-30000}
    X_SEARCH_WAIT_MS: ${X_SEARCH_WAIT_MS:-20000}
    X_SEARCH_RETRIES: ${X_SEARCH_RETRIES:-3}
    X_SEARCH_RETRY_SECONDS: ${X_SEARCH_RETRY_SECONDS:-10}
    X_FAIL_ON_ERROR: ${X_FAIL_ON_ERROR:-true}
    X_SCROLL_ROUNDS: ${X_SCROLL_ROUNDS:-5}
    X_SCROLL_WAIT_MS: ${X_SCROLL_WAIT_MS:-1500}
    X_MAX_EVENTS: ${X_MAX_EVENTS:-1000}
    REDDIT_SUBREDDITS: ${REDDIT_SUBREDDITS:-electricvehicles,teslamotors}
    REDDIT_COMMENT_SCAN_LIMIT: ${REDDIT_COMMENT_SCAN_LIMIT:-1000}
    REDDIT_KEYWORD_MATCH_MODE: ${REDDIT_KEYWORD_MATCH_MODE:-OR}
    REDDIT_WAIT_MS: ${REDDIT_WAIT_MS:-750}
    REDDIT_MAX_EVENTS: ${REDDIT_MAX_EVENTS:-1000}

  user: "0:0"

  volumes:
    - airflow-logs:/opt/airflow/logs
    - collector-state:/workspace/data/collector-state
    - insight-refresh:/workspace/data/insight-refresh
    - balancing:/workspace/data/balancing
    - /var/run/docker.sock:/var/run/docker.sock

services:

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    logging: *default-logging
    restart: unless-stopped

    container_name: minio

    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}

    command: server /data --console-address ":9001"

    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    logging: *default-logging

    depends_on:
      - minio

    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set lakehouse http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      /usr/bin/mc mb -p lakehouse/lakehouse || true
      "


  kafka:
    image: apache/kafka:3.7.0
    logging: *default-logging
    restart: unless-stopped

    container_name: kafka

    environment:
      - CLUSTER_ID=Y2FmZGRyb3Bfa3JhZnRfY2x1c3Rlcg==
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS=1
      - KAFKA_OFFSETS_TOPIC_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_MIN_INSYNC_REPLICAS=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0

    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}:9092"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    logging: *default-logging

    container_name: schema-registry

    depends_on:
      - kafka

    restart: unless-stopped

    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka:9092
      - SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR=1
      - SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS=10000

    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SCHEMA_REGISTRY_PORT:-8081}:8081"

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    logging: *default-logging
    restart: unless-stopped

    container_name: kafdrop

    depends_on:
      - kafka

    environment:
      - KAFKA_BROKERCONNECT=kafka:9092
      - JVM_OPTS=-Xms128M -Xmx256M

    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${KAFDROP_PORT:-9002}:9000"

  dashboard:
    image: ${DOCKERHUB_NAMESPACE:-raph0603}/user-behavior-social-media-dashboard:${PROJECT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    logging: *default-logging

    container_name: dashboard
    restart: unless-stopped

    depends_on:
      minio-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
      kafka:
        condition: service_started

    environment:
      - DASHBOARD_ICEBERG_TABLE_PATH=${DASHBOARD_ICEBERG_TABLE_PATH:-s3://lakehouse/warehouse/silver/events}
      - DASHBOARD_MINIO_ENDPOINT=http://minio:9000
      - DASHBOARD_MINIO_ACCESS_KEY=${DASHBOARD_MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      - DASHBOARD_MINIO_SECRET_KEY=${DASHBOARD_MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      - DASHBOARD_MINIO_REGION=${DASHBOARD_MINIO_REGION:-us-east-1}
      - DASHBOARD_AIRFLOW_URL=http://airflow-webserver:8080
      - DASHBOARD_AIRFLOW_USERNAME=${DASHBOARD_AIRFLOW_USERNAME:-admin}
      - DASHBOARD_AIRFLOW_PASSWORD=${DASHBOARD_AIRFLOW_PASSWORD:-admin}
      - DASHBOARD_AIRFLOW_TIMEOUT_SECONDS=${DASHBOARD_AIRFLOW_TIMEOUT_SECONDS:-10}
      - DASHBOARD_YOUTUBE_ENRICHMENT_STALE_HOURS=${DASHBOARD_YOUTUBE_ENRICHMENT_STALE_HOURS:-168}
      - DASHBOARD_YOUTUBE_SNAPSHOT_STALE_HOURS=${DASHBOARD_YOUTUBE_SNAPSHOT_STALE_HOURS:-24}
      - DASHBOARD_BALANCING_REPORT_PATH=/app/balancing/report.json
      - DASHBOARD_KAFKA_BOOTSTRAP=kafka:9092
      - DASHBOARD_MANUAL_YOUTUBE_TOPIC=${MANUAL_YOUTUBE_KAFKA_TOPIC:-manual.youtube.raw.events}
      - DASHBOARD_MANUAL_X_TOPIC=${MANUAL_X_KAFKA_TOPIC:-manual.x.raw.events}
      - DASHBOARD_MANUAL_REDDIT_TOPIC=${MANUAL_REDDIT_KAFKA_TOPIC:-manual.reddit.raw.events}

    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8501}:8501"

    volumes:
      - balancing:/app/balancing:ro

  youtube-collector:
    image: ${DOCKERHUB_NAMESPACE:-raph0603}/user-behavior-social-media-playwright:${PROJECT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: playwright/Dockerfile
    logging: *default-logging

    depends_on:
      - kafka
      - schema-registry

    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=${YOUTUBE_KAFKA_TOPIC:-youtube.raw.events}
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
