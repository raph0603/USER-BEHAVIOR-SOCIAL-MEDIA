    logging: *default-logging

    depends_on:
      - kafka
      - schema-registry

    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=${X_KAFKA_TOPIC:-x.raw.events}
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - SCHEMA_PATH=/app/schemas/playwright_event.avsc
      - SCHEMA_REGISTRY_WAIT_SEC=180
      - PRODUCER_MODE=x
      - X_CDP_URL=${X_CDP_URL:-}
      - X_CDP_HOST=${X_CDP_HOST:-host.docker.internal}
      - X_CDP_PORT_FILE=/app/x-runtime/cdp-port.txt
      - X_CDP_TOKEN_FILE=/app/x-runtime/cdp-token.txt
