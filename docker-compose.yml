    YOUTUBE_PIPELINE_SOURCE_TOPICS: ${YOUTUBE_PIPELINE_SOURCE_TOPICS:-youtube.metadata.events,youtube.transcript.results,youtube.comment.results,youtube.channel.results}
    X_COLLECTION_ENABLED: ${X_COLLECTION_ENABLED:-false}
    X_KAFKA_TOPIC: ${X_KAFKA_TOPIC:-x.raw.events}
    REDDIT_COLLECTION_ENABLED: ${REDDIT_COLLECTION_ENABLED:-false}
    REDDIT_KAFKA_TOPIC: ${REDDIT_KAFKA_TOPIC:-reddit.raw.events}
    YOUTUBE_CLEAN_KAFKA_TOPIC: ${YOUTUBE_CLEAN_KAFKA_TOPIC:-youtube.clean.events}
    X_CLEAN_KAFKA_TOPIC: ${X_CLEAN_KAFKA_TOPIC:-x.clean.events}
    REDDIT_CLEAN_KAFKA_TOPIC: ${REDDIT_CLEAN_KAFKA_TOPIC:-reddit.clean.events}
    YOUTUBE_DLQ_KAFKA_TOPIC: ${YOUTUBE_DLQ_KAFKA_TOPIC:-youtube.dlq.events}
    X_DLQ_KAFKA_TOPIC: ${X_DLQ_KAFKA_TOPIC:-x.dlq.events}
    REDDIT_DLQ_KAFKA_TOPIC: ${REDDIT_DLQ_KAFKA_TOPIC:-reddit.dlq.events}
    BRONZE_KAFKA_OUT_TOPIC: ${BRONZE_KAFKA_OUT_TOPIC:-lakehouse.bronze.for_silver}
