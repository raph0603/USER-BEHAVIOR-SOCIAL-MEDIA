  spark-master:
    image: ${DOCKERHUB_NAMESPACE:-raph0603}/user-behavior-social-media-spark-master:${PROJECT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: spark/master/Dockerfile
    logging: *default-logging

    container_name: spark-master

    hostname: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SPARK_MASTER_PORT:-7077}:7077"

    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=lakehouse
      - PRIVACY_HASH_SALT=dev-privacy-salt
      - YOUTUBE_VIRALITY_THRESHOLD=${YOUTUBE_VIRALITY_THRESHOLD:-8.0}
      - ML_DATASET_VERSION=${ML_DATASET_VERSION:-auto}
      - ML_LABEL_HORIZON_HOURS=${ML_LABEL_HORIZON_HOURS:-24}
      - ML_LABEL_TOLERANCE_HOURS=${ML_LABEL_TOLERANCE_HOURS:-24}
      - ML_VIRAL_QUANTILE=${ML_VIRAL_QUANTILE:-0.75}
      - ML_MIN_TEXT_CHARS=${ML_MIN_TEXT_CHARS:-3}
      - LAKEHOUSE_QUALITY_PROFILE=${LAKEHOUSE_QUALITY_PROFILE:-standard}
      - LAKEHOUSE_QUALITY_RULES_PATH=${LAKEHOUSE_QUALITY_RULES_PATH:-/opt/spark/jobs/config/lakehouse_quality_rules.json}
      - LAKEHOUSE_QUALITY_THRESHOLD_OVERRIDES=${LAKEHOUSE_QUALITY_THRESHOLD_OVERRIDES:-}
      - LAKEHOUSE_QUALITY_FAIL_ON=${LAKEHOUSE_QUALITY_FAIL_ON:-error}
      - LAKEHOUSE_QUALITY_REPORT_PATH=${LAKEHOUSE_QUALITY_REPORT_PATH:-/opt/spark/balancing/quality-report.json}
      - KAFKA_TOPIC=${YOUTUBE_KAFKA_TOPIC:-youtube.raw.events},${X_KAFKA_TOPIC:-x.raw.events},${REDDIT_KAFKA_TOPIC:-reddit.raw.events}
      - BRONZE_KAFKA_OUT_TOPIC=${BRONZE_KAFKA_OUT_TOPIC:-lakehouse.bronze.for_silver}
      - BRONZE_INGRESS_DLQ_TOPIC=${BRONZE_INGRESS_DLQ_TOPIC:-lakehouse.bronze.ingress.dlq}
      - KAFKA_FAIL_ON_DATA_LOSS=${KAFKA_FAIL_ON_DATA_LOSS:-true}
      - ALLOW_KAFKA_DATA_LOSS=${ALLOW_KAFKA_DATA_LOSS:-false}
      # Tuning knobs consumed by Spark jobs
      - SPARK_WORKER_COUNT=4
      - SPARK_WORKER_CORES=1
      # Optional override for shuffle partitions (if set, overrides auto calculation)
      - SPARK_SHUFFLE_PARTITIONS=

    volumes:
      - collector-state:/opt/spark/collector-state
      - insight-refresh:/opt/spark/insight-refresh
      - balancing:/opt/spark/balancing

  spark-worker:
    image: ${DOCKERHUB_NAMESPACE:-raph0603}/user-behavior-social-media-spark-worker:${PROJECT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: spark/worker/Dockerfile
    logging: *default-logging

    # Do not set container_name to allow scaling (multiple containers)
    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=lakehouse
      - PRIVACY_HASH_SALT=dev-privacy-salt
      - KAFKA_FAIL_ON_DATA_LOSS=${KAFKA_FAIL_ON_DATA_LOSS:-true}
      - ALLOW_KAFKA_DATA_LOSS=${ALLOW_KAFKA_DATA_LOSS:-false}
      - LAKEHOUSE_QUALITY_PROFILE=${LAKEHOUSE_QUALITY_PROFILE:-standard}
      - LAKEHOUSE_QUALITY_RULES_PATH=${LAKEHOUSE_QUALITY_RULES_PATH:-/opt/spark/jobs/config/lakehouse_quality_rules.json}
      - LAKEHOUSE_QUALITY_THRESHOLD_OVERRIDES=${LAKEHOUSE_QUALITY_THRESHOLD_OVERRIDES:-}
      - LAKEHOUSE_QUALITY_FAIL_ON=${LAKEHOUSE_QUALITY_FAIL_ON:-error}
      # Tunables for scaling
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G

    volumes:
      - insight-refresh:/opt/spark/insight-refresh
      - balancing:/opt/spark/balancing

  airflow-postgres:
    image: postgres:15-alpine
    logging: *default-logging
    stop_grace_period: 60s

    environment:
      - POSTGRES_DB=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_USER=airflow

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common

    depends_on:
      airflow-postgres:
        condition: service_healthy

    entrypoint: /bin/bash

    command: >
      -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Local
      --lastname Admin
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || true;
      airflow users reset-password
      --username ${AIRFLOW_ADMIN_USERNAME:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true
      "

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: webserver

    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_WEBSERVER_PORT:-8088}:8080"

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: scheduler

  ai-trainer:
    image: ${DOCKERHUB_NAMESPACE:-raph0603}/user-behavior-social-media-ai-trainer:${PROJECT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ml/Dockerfile
    logging: *default-logging
    profiles: ["ml"]
    working_dir: /workspace
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/workspace
      - balancing:/workspace/data/lakehouse-ml:ro
    command: >
      python ml/run_pipeline.py
      --lakehouse-manifest /workspace/data/lakehouse-ml/current.json
      --report

volumes:
  airflow-logs:
  airflow-postgres-data:
  balancing:
  collector-state:
  insight-refresh:
  minio-data:
