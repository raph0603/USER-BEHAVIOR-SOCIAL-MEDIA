    BALANCE_SEED: ${BALANCE_SEED:-42}
    BALANCE_TARGET_PER_GROUP: ${BALANCE_TARGET_PER_GROUP:-0}
    BALANCE_DIMENSIONS: ${BALANCE_DIMENSIONS:-source}
    ML_DATASET_VERSION: ${ML_DATASET_VERSION:-auto}
    ML_LABEL_HORIZON_HOURS: ${ML_LABEL_HORIZON_HOURS:-24}
    ML_LABEL_TOLERANCE_HOURS: ${ML_LABEL_TOLERANCE_HOURS:-24}
    ML_VIRAL_QUANTILE: ${ML_VIRAL_QUANTILE:-0.75}
