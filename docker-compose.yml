  reddit-collector:
    image: ${DOCKERHUB_NAMESPACE:-raph0603}/user-behavior-social-media-playwright:${PROJECT_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: playwright/Dockerfile
    logging: *default-logging

    depends_on:
      - kafka
      - schema-registry

    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=${REDDIT_KAFKA_TOPIC:-reddit.raw.events}
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
