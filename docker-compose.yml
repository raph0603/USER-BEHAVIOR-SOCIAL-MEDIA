    YOUTUBE_VIDEOS_DAILY_REQUEST_BUDGET: ${YOUTUBE_VIDEOS_DAILY_REQUEST_BUDGET:-500}
    YOUTUBE_VIDEOS_DAILY_QUOTA_UNITS: ${YOUTUBE_VIDEOS_DAILY_QUOTA_UNITS:-500}
