name: user-behavior-social-media

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestrator/airflow/Dockerfile
  image: ${DOCKERHUB_NAMESPACE:-raph0603}/user-behavior-social-media-airflow:${PROJECT_IMAGE_TAG:-latest}

  logging: *default-logging

  environment: &airflow-common-env
