    YOUTUBE_RECENT_SNAPSHOT_RESERVE_UNITS: ${YOUTUBE_RECENT_SNAPSHOT_RESERVE_UNITS:-2000}
    YOUTUBE_QUOTA_PRESSURE_RATIO: ${YOUTUBE_QUOTA_PRESSURE_RATIO:-0.80}
    YOUTUBE_QUOTA_CRITICAL_RATIO: ${YOUTUBE_QUOTA_CRITICAL_RATIO:-0.95}
    PIPELINE_QUEUE_WARNING_AGE_SECONDS: ${PIPELINE_QUEUE_WARNING_AGE_SECONDS:-900}
    PIPELINE_BRONZE_LAG_WARNING_SECONDS: ${PIPELINE_BRONZE_LAG_WARNING_SECONDS:-600}
    PIPELINE_SILVER_LAG_WARNING_SECONDS: ${PIPELINE_SILVER_LAG_WARNING_SECONDS:-900}
    YOUTUBE_METADATA_BATCH_SIZE: ${YOUTUBE_METADATA_BATCH_SIZE:-20}
    YOUTUBE_METADATA_CONCURRENCY: ${YOUTUBE_METADATA_CONCURRENCY:-1}
    YOUTUBE_METADATA_MAX_ATTEMPTS: ${YOUTUBE_METADATA_MAX_ATTEMPTS:-3}
