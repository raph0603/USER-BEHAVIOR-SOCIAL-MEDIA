services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until /usr/bin/mc alias set e2e http://minio:9000 minioadmin minioadmin; do
          sleep 1
        done
        /usr/bin/mc mb --ignore-existing e2e/lakehouse

  kafka:
    image: apache/kafka:3.7.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: 10000
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8081/subjects >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  spark:
    build:
      context: ../..
      dockerfile: spark/master/Dockerfile
    command: ["sleep", "infinity"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: lakehouse
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_FAIL_ON_DATA_LOSS: "true"
      ALLOW_KAFKA_DATA_LOSS: "false"
      PYSPARK_PYTHON: /usr/bin/python3
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_SQL_SHUFFLE_PARTITIONS: 2
      SPARK_DEFAULT_PARALLELISM: 2
      ML_MIN_TEXT_CHARS: 3
    volumes:
      - ./:/opt/spark/e2e:ro
      - ./.artifacts:/opt/spark/e2e-artifacts

  dashboard:
    build:
      context: ../..
      dockerfile: dashboard/Dockerfile
    command: ["sleep", "infinity"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      DASHBOARD_ICEBERG_TABLE_PATH: s3://lakehouse/warehouse/silver/events
      DASHBOARD_ICEBERG_WAREHOUSE_PATH: s3://lakehouse/warehouse
      DASHBOARD_MINIO_ENDPOINT: http://minio:9000
      DASHBOARD_MINIO_ACCESS_KEY: minioadmin
      DASHBOARD_MINIO_SECRET_KEY: minioadmin
      DASHBOARD_MINIO_REGION: us-east-1
      DASHBOARD_ICEBERG_UNSAFE_VERSION_GUESSING: "true"
    volumes:
      - ./:/app/e2e:ro
      - ./.artifacts:/app/e2e-artifacts

volumes:
  minio-data:
