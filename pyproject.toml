[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "spark: tests that require a local JVM-backed PySpark runtime",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "annotation_marketing/*.jsonl",
    "data",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
# Keep the first repository-wide lint gate focused on runtime-breaking errors.
select = ["E9", "F63", "F7", "F82"]
