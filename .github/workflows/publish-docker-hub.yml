name: Publish Docker Hub images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, for example v1.11.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-docker-hub:
    name: Publish Docker Hub images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: user-behavior-social-media-dashboard
            context: .
            dockerfile: ./dashboard/Dockerfile
          - image: user-behavior-social-media-airflow
            context: .
            dockerfile: ./orchestrator/airflow/Dockerfile
          - image: user-behavior-social-media-playwright
            context: .
            dockerfile: ./playwright/Dockerfile
          - image: user-behavior-social-media-spark-master
            context: .
            dockerfile: ./spark/master/Dockerfile
          - image: user-behavior-social-media-spark-worker
            context: .
            dockerfile: ./spark/worker/Dockerfile
          - image: user-behavior-social-media-ai-trainer
            context: .
            dockerfile: ./ml/Dockerfile

    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Docker Hub repository
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          TOKEN_RESPONSE=$(curl --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/) || true

          JWT=$(python -c 'import json,sys; print(json.load(sys.stdin)["token"])' \
            <<< "$TOKEN_RESPONSE" 2>/dev/null) || true

          if [ -z "${JWT:-}" ]; then
            echo "Warning: could not retrieve Docker Hub JWT, skipping repository creation."
          else
            STATUS=$(curl --silent --show-error \
              --output /tmp/dockerhub-create-repository.json \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: JWT $JWT" \
              --header "Content-Type: application/json" \
              --data "{\"namespace\":\"$DOCKERHUB_NAMESPACE\",\"name\":\"$IMAGE_NAME\",\"is_private\":false}" \
              "https://hub.docker.com/v2/repositories/$DOCKERHUB_NAMESPACE/") || true

            if [ "$STATUS" = "201" ]; then
              echo "Docker Hub repository $DOCKERHUB_NAMESPACE/$IMAGE_NAME created."
            elif [ "$STATUS" = "409" ]; then
              echo "Docker Hub repository $DOCKERHUB_NAMESPACE/$IMAGE_NAME already exists."
            else
              echo "Warning: Docker Hub repository creation returned HTTP $STATUS (non-blocking)."
              cat /tmp/dockerhub-create-repository.json || true
            fi
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:production
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:latest

  publish-compose-bundle:
    name: Publish Docker Compose bundle
    needs: publish-docker-hub
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Package Docker Compose bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_NAME="user-behavior-social-media-compose-${IMAGE_TAG}"
          BUNDLE_DIR="dist/${BUNDLE_NAME}"
          mkdir -p "$BUNDLE_DIR"
          cp docker-compose.yml "$BUNDLE_DIR/compose.yaml"
          cp deployment/compose.bundle.yaml "$BUNDLE_DIR/compose.bundle.yaml"
          cp deployment/README.md "$BUNDLE_DIR/README.md"
          sed "s/^PROJECT_IMAGE_TAG=.*/PROJECT_IMAGE_TAG=${IMAGE_TAG}/" \
            .env.example > "$BUNDLE_DIR/.env.example"
          cd dist
          zip -r "${BUNDLE_NAME}.zip" "$BUNDLE_NAME"

      - name: Attach bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_NAME="user-behavior-social-media-compose-${IMAGE_TAG}"
          if gh release view "$IMAGE_TAG" > /dev/null 2>&1; then
            gh release upload "$IMAGE_TAG" "dist/${BUNDLE_NAME}.zip" --clobber
          else
            echo "No GitHub release exists for ${IMAGE_TAG}; bundle retained as workflow output."
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-behavior-social-media-compose-${{ env.IMAGE_TAG }}
          path: dist/user-behavior-social-media-compose-${{ env.IMAGE_TAG }}.zip
          if-no-files-found: error
