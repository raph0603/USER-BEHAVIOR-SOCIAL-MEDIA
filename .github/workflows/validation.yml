name: Reusable Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-unit:
    name: static-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            dashboard/requirements.txt

      - name: Install unit-test dependencies
        run: >-
          python -m pip install
          --requirement requirements-test.txt
          --requirement dashboard/requirements.txt
          pyspark==3.5.2

      - name: Lint Python sources
        run: python -m ruff check .

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          common dashboard ml orchestrator playwright
          scripts spark tests

      - name: Run non-Spark unit tests
        run: python -m pytest -m "not spark"

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install contract-test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Validate Avro schemas
        shell: python
        run: |
          import json
          from pathlib import Path

          schemas = sorted(Path("schemas").glob("*.avsc"))
          if not schemas:
              raise SystemExit("No Avro schemas found")
          for schema in schemas:
              json.loads(schema.read_text(encoding="utf-8"))
              print(f"validated {schema}")

      - name: Run canonical contract tests
        run: >-
          python -m pytest
          tests/scripts/test_event_contract_provenance.py
          tests/scripts/test_pipeline_reliability.py
          tests/scripts/test_transcript_lifecycle.py
          tests/e2e/test_pipeline_fixture.py

      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example \
            -f docker-compose.yml -f deployment/compose.bundle.yaml config --quiet
          docker compose -f tests/e2e/docker-compose.yml config --quiet

  spark:
    name: spark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Spark test dependencies
        run: python -m pip install pytest==8.4.1 pyspark==3.5.2

      - name: Run Spark unit tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: >-
          python -m pytest
          tests/scripts/test_engagement_snapshots.py
          tests/scripts/test_silver_post_features.py

  airflow:
    name: airflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Airflow validation image
        run: docker build --file orchestrator/airflow/Dockerfile --tag pipeline-airflow-test .

      - name: Validate DagBag without network access
        run: >-
          docker run --rm
          --env AIRFLOW__CORE__LOAD_EXAMPLES=False
          --env AIRFLOW__CORE__UNIT_TEST_MODE=True
          pipeline-airflow-test
          python -m unittest discover
          --start-directory /workspace/tests/airflow
          --verbose

  e2e:
    name: e2e
    needs: [static-unit, contracts, spark, airflow]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic Docker pipeline
        run: bash tests/e2e/run_pipeline_reliability_e2e.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reliability-e2e
          path: tests/e2e/.artifacts
          if-no-files-found: ignore
