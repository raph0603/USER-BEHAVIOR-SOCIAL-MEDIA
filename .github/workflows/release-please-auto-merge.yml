name: Auto Merge Release Please

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.event.pull_request.head.ref, 'release-please--')}} 
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto merge
        run: gh pr merge ${{ github.event.pull_request.number }} --merge --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
