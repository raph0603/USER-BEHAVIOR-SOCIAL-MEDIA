name: Stable Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # TODO: Ajouter les vérifications avant release

      - name: Validation placeholder
        run: echo "Aucune vérification configurée pour le moment"

  release-please:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          release-type: simple

      - name: Enable auto-merge
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          gh pr merge ${{ fromJson(steps.release.outputs.pr).number }} --merge --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
