name: Production Release

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: production
          release-type: simple

      - name: Find Release Please PR
        id: release_pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --base production \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number' \
            | head -n 1)

          if [ -z "$PR_NUMBER" ]; then
            echo "No Release Please PR found."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for Release Please PR
        if: ${{ steps.release_pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          set -e

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --auto

      - name: Wait for Release Please PR merge
        if: ${{ steps.release_pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          set -e

          for i in {1..60}; do
            MERGED_AT=$(gh pr view "$PR_NUMBER" \
              --repo "$REPO" \
              --json mergedAt \
              --jq '.mergedAt // ""')

            if [ -n "$MERGED_AT" ]; then
              echo "Release Please PR #$PR_NUMBER has been merged."
              exit 0
            fi

            echo "Waiting for Release Please PR #$PR_NUMBER to be merged..."
            sleep 10
          done

          echo "Release Please PR #$PR_NUMBER was not merged after waiting."
          exit 1

      - name: Dispatch final release workflow
        if: ${{ steps.release_pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run release-please.yml \
            --repo "$REPO" \
            --ref production

  publish-docker-hub:
    name: Publish Docker Hub images
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: user-behavior-social-media-dashboard
            context: ./dashboard
            dockerfile: ./dashboard/Dockerfile
          - image: user-behavior-social-media-airflow
            context: ./orchestrator/airflow
            dockerfile: ./orchestrator/airflow/Dockerfile
          - image: user-behavior-social-media-playwright
            context: ./playwright
            dockerfile: ./playwright/Dockerfile
          - image: user-behavior-social-media-spark-master
            context: ./spark
            dockerfile: ./spark/master/Dockerfile
          - image: user-behavior-social-media-spark-worker
            context: ./spark
            dockerfile: ./spark/worker/Dockerfile

    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Docker Hub repository
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            https://hub.docker.com/v2/users/login/)

          JWT=$(python -c 'import json,sys; print(json.load(sys.stdin)["token"])' \
            <<< "$TOKEN_RESPONSE")

          STATUS=$(curl --silent --show-error \
            --output /tmp/dockerhub-create-repository.json \
            --write-out "%{http_code}" \
            --request POST \
            --header "Authorization: JWT $JWT" \
            --header "Content-Type: application/json" \
            --data "{\"namespace\":\"$DOCKERHUB_NAMESPACE\",\"name\":\"$IMAGE_NAME\",\"is_private\":false}" \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_NAMESPACE/")

          if [ "$STATUS" = "201" ] || [ "$STATUS" = "409" ]; then
            echo "Docker Hub repository $DOCKERHUB_NAMESPACE/$IMAGE_NAME is ready."
            exit 0
          fi

          cat /tmp/dockerhub-create-repository.json
          echo "Docker Hub repository creation failed with HTTP $STATUS."
          exit 1

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ needs.release.outputs.tag_name }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:production
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:latest
