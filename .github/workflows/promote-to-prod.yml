name: Promote Main to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # TODO: Ajouter tes vérifications ici
      - name: Validation placeholder
        run: echo "Main validée, promotion vers production"

      - name: Create PR main to production
        id: create_pr
        run: |
          PR_URL=$(gh pr create \
            --base production \
            --head main \
            --title "chore: promote main to production" \
            --body "Promotion automatique de main vers production." \
          || gh pr list \
            --base production \
            --head main \
            --state open \
            --json url \
            --jq '.[0].url')

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge main to production
        run: |
          gh pr merge "${{ steps.create_pr.outputs.pr_url }}" --merge --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
