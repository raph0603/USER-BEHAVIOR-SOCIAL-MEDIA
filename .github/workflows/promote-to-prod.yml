name: Promote Main to Production

on:
  workflow_run:
    workflows:
      - Main Branch Validation
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  promote:
    name: Promote main to production
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch'
      || (
        github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or get PR main to production
        id: create_pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          PR_NUMBER=$(gh pr list \
            --repo "$REPO" \
            --base production \
            --head main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --repo "$REPO" \
              --base production \
              --head main \
              --title "chore: promote main to production" \
              --body "Promote the validated main branch to production." \
              || true

            PR_NUMBER=$(gh pr list \
              --repo "$REPO" \
              --base production \
              --head main \
              --state open \
              --json number \
              --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open promotion PR found. main may already be in sync with production."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge main to production
        if: ${{ steps.create_pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          set -e

          for i in {1..10}; do
            MERGED_AT=$(gh pr view "$PR_NUMBER" \
              --repo "$REPO" \
              --json mergedAt \
              --jq '.mergedAt // ""')

            if [ -n "$MERGED_AT" ]; then
              echo "PR #$PR_NUMBER is already merged."
              exit 0
            fi

            if gh pr merge "$PR_NUMBER" \
              --repo "$REPO" \
              --merge \
              --auto; then
              echo "Auto-merge enabled for PR #$PR_NUMBER."
              exit 0
            fi

            echo "Auto-merge could not be enabled yet. Retrying..."
            sleep 10
          done

          MERGED_AT=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json mergedAt \
            --jq '.mergedAt // ""')

          if [ -n "$MERGED_AT" ]; then
            echo "PR #$PR_NUMBER was merged during retries."
            exit 0
          fi

          echo "Could not enable auto-merge for PR #$PR_NUMBER."
          exit 1

      - name: Wait for production promotion merge
        if: ${{ steps.create_pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          set -e

          for i in {1..60}; do
            MERGED_AT=$(gh pr view "$PR_NUMBER" \
              --repo "$REPO" \
              --json mergedAt \
              --jq '.mergedAt // ""')

            if [ -n "$MERGED_AT" ]; then
              echo "PR #$PR_NUMBER has been merged."
              exit 0
            fi

            echo "Waiting for PR #$PR_NUMBER to be merged..."
            sleep 10
          done

          echo "PR #$PR_NUMBER was not merged after waiting."
          exit 1

      - name: Dispatch production release workflow
        if: ${{ steps.create_pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run release-please.yml \
            --repo "$REPO" \
            --ref production
